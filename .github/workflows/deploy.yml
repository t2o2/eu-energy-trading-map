name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at midday (UTC). GitHub's scheduler is best-effort and often runs late.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  # write so a healthy snapshot can be committed back as the fallback.
  contents: write
  pages: write
  id-token: write

# Never let a cron run and a push deploy clobber each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch grid snapshot
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: npm run snapshot

      # A healthy fetch becomes the committed last-known-good, so the next
      # ENTSO-E maintenance window falls back to hours-old data rather than
      # whatever was last committed by hand. When the fetch is rejected the
      # script leaves the file untouched, so there is nothing to commit and
      # this step is a no-op. [skip ci] stops the push retriggering this
      # workflow — the deploy it would trigger is the one already running.
      - name: Commit refreshed snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/data/snapshot.json; then
            echo "snapshot unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "Refresh grid snapshot [skip ci]"
          # checkout leaves a detached HEAD, hence the explicit refspec. A lost
          # race against another push costs us this one fallback refresh, not
          # the deploy, so it warns instead of failing.
          git push origin HEAD:main ||
            echo "::warning::could not push refreshed snapshot; deploy continues"

      - name: Build static site
        env:
          # Project pages are served from /<repo>.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Browser-visible by design; kept in a secret only to stay out of git.
          NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
